name: Deploy production — only a gated commit

# WHY THIS FILE EXISTS
#
# Production used to go live from a push to `main`, with nothing between the push and the users: the
# live commit on 2026-10-16 (`7d19c25`) was promoted at 15:18:55Z while its own CI run was still
# starting, and that run failed 14 minutes later. Vercel's git integration cannot wait for a check, and
# this repository's plan has no branch protection, so the wait has to live here.
#
# Two halves, and both are required:
#
#   * `vercel.json` sets `git.deploymentEnabled.main = false` — a push to `main` no longer deploys.
#   * this workflow asks Vercel to build one exact commit, after the CI workflow concluded `success`
#     for that same commit, while that commit is still `main`'s head.
#
# The decision itself is `scripts/lib/deploy-gate.mjs` (pure, unit-tested, exits 2 on refusal), and the
# request is `scripts/deploy/trigger-production.mjs`. If `VERCEL_TOKEN` or `VERCEL_PROJECT_ID` is
# missing the script refuses and nothing is deployed: a missing credential is never a reason to fall
# back to the git integration.
#
# Required configuration (repository secrets — the names are the ones already configured):
#   secret   VERCEL_TOKEN        a Vercel token that may create deployments for this project
#   secret   VERCEL_PROJECTID    prj_tWZoyuctxYUj6RiA60q1d3ZACK52
#   secret   VERCEL_TEAMID       team_pNyiPYZgdGx5L8CvqMaPL3ai
#
# A dispatch exists for a re-deploy or a manual gate check. It is not an override: the script reads the
# CI run for the named commit and refuses unless that run concluded `success`.

on:
  workflow_run:
    workflows: ['CI — gates for a candidate commit']
    types: [completed]
  workflow_dispatch:
    inputs:
      sha:
        description: 'Commit to deploy (must have a successful CI run and be main’s head)'
        required: true
        type: string
      dry_run:
        description: 'Decide and print only — do not ask Vercel to deploy'
        required: false
        type: boolean
        default: true
      publish_ota:
        description: 'Also publish this commit as the production OTA bundle (offers the update to installed phones)'
        required: false
        type: boolean
        default: false
      ota_version:
        description: 'OTA version for the production channel (must be newer than the active one; default 1.1.<dispatch run>)'
        required: false
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy the gated commit
    # The failed-gate behaviour is this line: a CI run that did not conclude `success` never enters
    # the job at all. A dispatch enters it, and the script applies the same rule to the named commit.
    if: >
      (github.event_name == 'workflow_run' &&
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_branch == 'main') ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout the gated commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || inputs.sha }}
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Decide, and deploy only if the gate passes
        # No soft-fail flag and no fallback to the git integration: a refusal here is the intended
        # outcome for a red, stale or unattributed candidate.
        env:
          DEPLOY_EVENT: ${{ github.event_name }}
          CI_CONCLUSION: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.conclusion || '' }}
          GATED_BRANCH: main
          GATED_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || inputs.sha }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && '1' || '0' }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          # The repository's secret names are VERCEL_PROJECTID / VERCEL_TEAMID (no underscore). The
          # script's own environment names stay descriptive; the mapping happens here, once.
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECTID }}
          VERCEL_TEAM_ID: ${{ secrets.VERCEL_TEAMID }}
        run: node scripts/deploy/trigger-production.mjs

      # INSTALLED PHONES ARE UPDATED BY THE OTA CHANNEL, NOT BY VERCEL. The Vercel step above
      # redeploys the web app for browser users; an APK already on a phone asks `ota-manifest` for a
      # bundle, and that function offers one only when its version is strictly newer than the
      # running one. So a production promotion is not complete until the bundle is published and
      # provably downloadable.
      #
      # It runs ONLY on an explicit dispatch that asks for it (`publish_ota: true`): a bundle is
      # offered to real devices, so it is an owner decision, never a side effect of a green CI run
      # on main. The default dispatch stays a decision-only dry run.
      - name: Install dependencies for the OTA build
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_ota }}
        run: npm ci --legacy-peer-deps

      - name: Build the production web bundle (VITE_APP_ENV=production)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_ota }}
        env:
          VITE_APP_ENV: production
          VITE_SUPABASE_URL: ${{ secrets.PROD_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.PROD_SUPABASE_ANON_KEY }}
          VITE_SUPABASE_PROJECT_ID: gkswcfljxlutkfdvvqng
          VITE_OTA_CHANNEL: production
          VITE_OTA_MANIFEST_URL: ${{ secrets.PROD_SUPABASE_URL }}/functions/v1/ota-manifest
        run: npm run build

      - name: Publish the production OTA bundle
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_ota }}
        env:
          OTA_SUPABASE_URL: ${{ secrets.PROD_SUPABASE_URL }}
          OTA_SERVICE_ROLE_KEY: ${{ secrets.PROD_SUPABASE_SERVICE_ROLE }}
          REQUESTED_VERSION: ${{ inputs.ota_version }}
        run: |
          set -euo pipefail
          if [ -z "${OTA_SUPABASE_URL:-}" ] || [ -z "${OTA_SERVICE_ROLE_KEY:-}" ]; then
            echo "::error::PROD_SUPABASE_URL / PROD_SUPABASE_SERVICE_ROLE are not configured — cannot publish an OTA bundle"
            exit 1
          fi
          version="${REQUESTED_VERSION:-}"
          if [ -z "$version" ]; then
            version=$(node -e "const p=require('./package.json');const [a,b]=String(p.version).split('.');process.stdout.write(a+'.'+b+'.'+process.env.GITHUB_RUN_NUMBER)")
          fi
          echo "OTA_VERSION=$version" >> "$GITHUB_ENV"
          node scripts/ota/publish.mjs --env production --confirm-production --version "$version" --activate \
            --notes "deploy production ${GITHUB_SHA:0:7}"

      - name: The production bundle must actually download
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_ota }}
        env:
          OTA_SUPABASE_URL: ${{ secrets.PROD_SUPABASE_URL }}
          OTA_SERVICE_ROLE_KEY: ${{ secrets.PROD_SUPABASE_SERVICE_ROLE }}
        run: |
          set -euo pipefail
          url=$(curl -fsS "$OTA_SUPABASE_URL/rest/v1/ota_bundles?channel=eq.production&status=eq.active&select=version,url" \
            -H "apikey: $OTA_SERVICE_ROLE_KEY" -H "Authorization: Bearer $OTA_SERVICE_ROLE_KEY" \
            | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const r=JSON.parse(s)[0];if(!r)process.exit(3);process.stdout.write(r.url)})')
          code=$(curl -s -o /dev/null -w "%{http_code}" -r 0-1023 "$url")
          echo "active production bundle: $url (HTTP $code)"
          if [ "$code" != "200" ]; then
            echo "::error::the active production bundle is not downloadable"
            exit 1
          fi
          {
            echo "- OTA bundle: \`$url\`"
            echo "- OTA version: \`$OTA_VERSION\` (HTTP $code)"
          } >> "$GITHUB_STEP_SUMMARY"
