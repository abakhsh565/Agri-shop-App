name: Deploy production — only a gated commit

# WHY THIS FILE EXISTS
#
# Production used to go live from a push to `main`, with nothing between the push and the users: the
# live commit on 2026-10-16 (`7d19c25`) was promoted at 15:18:55Z while its own CI run was still
# starting, and that run failed 14 minutes later. Vercel's git integration cannot wait for a check, and
# this repository's plan has no branch protection, so the wait has to live here.
#
# Two halves, and both are required:
#
#   * `vercel.json` sets `git.deploymentEnabled.main = false` — a push to `main` no longer deploys.
#   * this workflow asks Vercel to build one exact commit, after the CI workflow concluded `success`
#     for that same commit, while that commit is still `main`'s head.
#
# The decision itself is `scripts/lib/deploy-gate.mjs` (pure, unit-tested, exits 2 on refusal), and the
# request is `scripts/deploy/trigger-production.mjs`. If `VERCEL_TOKEN` or `VERCEL_PROJECT_ID` is
# missing the script refuses and nothing is deployed: a missing credential is never a reason to fall
# back to the git integration.
#
# THE RELEASE IS NOT THE REQUEST. Vercel's answer means the build was queued, not that production
# serves it — measured 2026-10-18, this workflow reported `success` 16s after the POST while the build
# was still running. So a second step waits for the deployment, checks the production URL actually
# serves the app (`scripts/deploy/verify-production.mjs`), and returns production to the previous
# promoted deployment if the page is wrong. A failed build leaves the previous deployment serving and
# is reported as a failure, not a release.
#
# Required configuration (repository secrets — the names are the ones already configured):
#   secret   VERCEL_TOKEN        a Vercel token that may create deployments for this project
#   secret   VERCEL_PROJECTID    prj_tWZoyuctxYUj6RiA60q1d3ZACK52
#   secret   VERCEL_TEAMID       team_pNyiPYZgdGx5L8CvqMaPL3ai
#
# A dispatch exists for a re-deploy or a manual gate check. It is not an override: the script reads the
# CI run for the named commit and refuses unless that run concluded `success`.

on:
  workflow_run:
    workflows: ['CI — gates for a candidate commit']
    types: [completed]
  workflow_dispatch:
    inputs:
      sha:
        description: 'Commit to deploy (must have a successful CI run and be main’s head)'
        required: true
        type: string
      dry_run:
        description: 'Decide and print only — do not ask Vercel to deploy'
        required: false
        type: boolean
        default: true

permissions:
  contents: read
  actions: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy the gated commit
    # The failed-gate behaviour is this line: a CI run that did not conclude `success` never enters
    # the job at all. A dispatch enters it, and the script applies the same rule to the named commit.
    if: >
      (github.event_name == 'workflow_run' &&
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_branch == 'main') ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    # 15 was enough for a POST. Waiting for the build (600s) plus the smoke check needs headroom.
    timeout-minutes: 25
    steps:
      - name: Checkout the gated commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || inputs.sha }}
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Decide, and deploy only if the gate passes
        id: trigger
        # No soft-fail flag and no fallback to the git integration: a refusal here is the intended
        # outcome for a red, stale or unattributed candidate.
        env:
          DEPLOY_EVENT: ${{ github.event_name }}
          CI_CONCLUSION: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.conclusion || '' }}
          GATED_BRANCH: main
          GATED_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || inputs.sha }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && '1' || '0' }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          # The repository's secret names are VERCEL_PROJECTID / VERCEL_TEAMID (no underscore). The
          # script's own environment names stay descriptive; the mapping happens here, once.
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECTID }}
          VERCEL_TEAM_ID: ${{ secrets.VERCEL_TEAMID }}
        run: node scripts/deploy/trigger-production.mjs

      - name: Wait for the build, verify production serves it, roll back if not
        # Runs only when the trigger actually created a deployment (a dry run creates none). The
        # step fails closed: a timeout or an unreadable page is a failure, never "probably fine".
        if: steps.trigger.outputs.deployment_id != ''
        env:
          DEPLOYMENT_ID: ${{ steps.trigger.outputs.deployment_id }}
          # The deployment's own immutable URL, from the POST response. The single-deployment GET
          # does not document `url`, so this is what the entry-bundle comparison uses as its
          # reference when the GET omits it.
          DEPLOYMENT_URL: ${{ steps.trigger.outputs.deployment_url }}
          GATED_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || inputs.sha }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECTID }}
          VERCEL_TEAM_ID: ${{ secrets.VERCEL_TEAMID }}
          # The domain customers use, not the project's generated hostname.
          SMOKE_URL: https://hisaabkitaab.dpdns.org
          VERCEL_PROJECT_NAME: agri-shop-app
          TIMEOUT_SECONDS: '600'
          POLL_SECONDS: '10'
          ROLLBACK_TIMEOUT_SECONDS: '300'
        run: node scripts/deploy/verify-production.mjs

# THE RELEASE TIMELINE IS NOT A STEP HERE, ON PURPOSE.
#
# Recording this release in the error reporter's timeline happens in `release-timeline.yml`, which is
# triggered by this workflow finishing successfully. Two reasons, both of them rules this file already
# keeps: (1) a marker is not a gate, and this job's conclusion must mean exactly one thing — the
# release shipped and was verified — so nothing about monitoring may colour it; (2) the alternative
# (a soft-failed step here) is the failure mode `tests/unit/productionDeployGate.test.ts` exists to
# forbid. A separate workflow can be red honestly, which is what the backup watchdog already does.
