# Deploy staging — migrate the staging schema, build the staging bundle, report the live URL.
#
# Staging is the middle of the permanent chain dev -> staging -> main. Two things used to be
# manual here and both of them drifted: the staging ledger was applied by a person remembering to
# dispatch `apply-staging-migrations`, and the staging web build was whatever the last preview
# happened to be. This workflow makes the branch itself the trigger, so "merged to staging" means
# "schema applied, bundle built, URL published".
#
# What it may do: apply PENDING migrations to the staging project only (`--env staging`), read the
# ledger back, build a `VITE_APP_ENV=staging` bundle. What it may not do: touch production, run a
# table-wide cleanup, or write QA business data (the migrate tool refuses production before it
# resolves a credential, and the apply is the same tool the manual workflow uses).
name: Deploy staging — migrate, build, report URL

on:
  push:
    branches: [staging]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - 'device-evidence/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # One QA database, one staging environment. Serialised like the QA jobs, and never cancelled:
  # a cancelled migration apply leaves the ledger half-recorded.
  group: deploy-staging
  cancel-in-progress: false

jobs:
  deploy:
    name: Apply staging migrations, build, report the URL
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: staging
    env:
      NODE_OPTIONS: --dns-result-order=ipv4first
      QA_SUPABASE_URL: ${{ secrets.QA_SUPABASE_URL }}
      QA_SUPABASE_ANON_KEY: ${{ secrets.QA_SUPABASE_ANON_KEY }}
      QA_SUPABASE_SERVICE_ROLE: ${{ secrets.QA_SUPABASE_SERVICE_ROLE }}
      QA_DB_HOST: ${{ secrets.QA_DB_HOST }}
      QA_DB_USER: ${{ secrets.QA_DB_USER }}
      QA_DB_PASS: ${{ secrets.QA_DB_PASS }}
    steps:
      - name: Checkout the staging commit
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Staging credentials are required — an apply that did not run is not a pass
        run: |
          missing=""
          for key in QA_SUPABASE_URL QA_SUPABASE_ANON_KEY QA_SUPABASE_SERVICE_ROLE QA_DB_HOST QA_DB_USER QA_DB_PASS; do
            if [ -z "${!key:-}" ]; then missing="$missing $key"; fi
          done
          if [ -n "$missing" ]; then
            echo "::error::staging deploy is BLOCKED, not passed — missing:$missing"
            exit 1
          fi

      - name: Ledger before the apply (pending is expected here)
        run: node scripts/migrate.mjs status --env staging

      - name: Apply pending migrations to staging
        run: node scripts/migrate.mjs apply --env staging --apply

      - name: The staging ledger must now show nothing pending
        run: node scripts/migrate.mjs verify --env staging

      # The staging bundle is built with VITE_OTP_DELIVERY: demo (two steps below), so this database
      # signs people in with the derived credentials exactly like development does — and a real SMS
      # build is the only environment where the sign-in itself creates `auth.users`. Without this,
      # every approved request on staging left a profile with no login behind it and the next sign-in
      # answered LOGIN_NOT_READY (measured 2026-11-14 on 923004444444). Production never runs this:
      # `tests/unit/loginBridgeGuard.test.ts` fails if it appears in deploy-production.yml.
      - name: The demo-OTP bundle gets the login bridge its sign-in depends on
        run: node scripts/dev/login-bridge.mjs enable --remote staging

      - name: Build the staging bundle (VITE_APP_ENV=staging)
        env:
          VITE_APP_ENV: staging
          VITE_SUPABASE_URL: ${{ secrets.QA_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.QA_SUPABASE_ANON_KEY }}
          VITE_SUPABASE_PROJECT_ID: bpybjrjenwccowvtrevu
          VITE_OTP_DELIVERY: demo
        run: npx vite build --mode qa

      # WHY A VERSION IS DERIVED HERE, NOT READ FROM package.json. `ota_manifest` offers a bundle
      # only when `ota_compare_versions(bundle.version, current) > 0`. Publishing the same 1.1.0
      # bytes on every promotion therefore reaches nobody: an install already on 1.1.0 is told
      # there is no update, however new the bundle is. The run number makes each promotion
      # strictly newer (1.1.0 -> 1.1.<run>) while staying inside the ledger's version grammar.
      - name: Publish this bundle to the staging channel
        env:
          OTA_SUPABASE_URL: ${{ secrets.QA_SUPABASE_URL }}
          OTA_SERVICE_ROLE_KEY: ${{ secrets.QA_SUPABASE_SERVICE_ROLE }}
        run: |
          set -euo pipefail
          version=$(node -e "const p=require('./package.json');const [a,b]=String(p.version).split('.');process.stdout.write(a+'.'+b+'.'+process.env.GITHUB_RUN_NUMBER)")
          echo "OTA_VERSION=$version" >> "$GITHUB_ENV"
          node scripts/ota/publish.mjs --env staging --version "$version" --activate \
            --notes "deploy staging ${GITHUB_SHA:0:7}"

      # A build that published nothing, or published an object nobody can download, is not a
      # promotion. This reads the ledger back and fetches the first bytes of the object.
      - name: The published bundle must actually download
        env:
          OTA_SUPABASE_URL: ${{ secrets.QA_SUPABASE_URL }}
          OTA_SERVICE_ROLE_KEY: ${{ secrets.QA_SUPABASE_SERVICE_ROLE }}
        run: |
          set -euo pipefail
          url=$(curl -fsS "$OTA_SUPABASE_URL/rest/v1/ota_bundles?channel=eq.staging&status=eq.active&select=version,url,checksum,size_bytes" \
            -H "apikey: $OTA_SERVICE_ROLE_KEY" -H "Authorization: Bearer $OTA_SERVICE_ROLE_KEY" \
            | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const r=JSON.parse(s)[0];if(!r)process.exit(3);process.stdout.write(r.url)})')
          # A ranged read is what the app's own downloader does, and object storage answers it with
          # 206 Partial Content. Only a real 200/206 carrying bytes proves the object is served;
          # asking for a range and then demanding 200 failed every promotion that got this far.
          code=$(curl -s -o /dev/null -w "%{http_code}" -r 0-1023 "$url")
          head=$(curl -fsSI "$url" | tr -d '\r' | awk -F': ' 'tolower($1)=="content-length"{print $2}')
          echo "active bundle: $url (HTTP $code, $head bytes)"
          if [ "$code" != "200" ] && [ "$code" != "206" ]; then
            echo "::error::the active staging bundle is not downloadable — the app would be offered a 404"
            exit 1
          fi
          {
            echo "- OTA bundle: \`$url\`"
            echo "- OTA version: \`$OTA_VERSION\` (HTTP $code, $head bytes)"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Report the live staging URL
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECTID }}
          VERCEL_TEAM_ID: ${{ secrets.VERCEL_TEAMID }}
          STAGING_REF: staging
          STAGING_SHA: ${{ github.sha }}
        run: |
          echo "### Staging deployment" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- commit: \`${{ github.sha }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- branch: \`staging\`" >> "$GITHUB_STEP_SUMMARY"
          node scripts/deploy/staging-url.mjs
