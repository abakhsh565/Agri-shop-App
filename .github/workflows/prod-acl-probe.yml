name: Production ACL probe (read-only, 0266 diagnostic)

# READ-ONLY diagnostic for the batch-1 0266 rehearsal failure (run 42763699341):
# 0266's DO block raises because has_function_privilege('anon'/'authenticated',
# 'co_owner_sync_membership', 'EXECUTE') is true on real production after
# CREATE + REVOKE ALL FROM PUBLIC, anon. The pg_dump cannot answer why: it was
# taken with --no-privileges and never carries pg_auth_members. This workflow
# runs SELECT-only queries from a runner (which can reach production; this VM
# cannot) and prints the results to the log. It can NEVER write: every query
# below is a SELECT, there is no migration step, no apply flag, and no
# production secret or password anywhere in this file. Manual dispatch only,
# on this probe branch only — never merge to main.
on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL 17 client (psql)
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq curl ca-certificates
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc --fail https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-17
          /usr/lib/postgresql/17/bin/psql --version
      - name: Run read-only production ACL probes
        env:
          PGPASSWORD: ${{ secrets.PROD_DB_PASS }}
          PROD_DB_HOST: ${{ secrets.PROD_DB_HOST }}
          PROD_DB_USER: ${{ secrets.PROD_DB_USER }}
        run: |
          set -euo pipefail
          PSQL="/usr/lib/postgresql/17/bin/psql host=${PROD_DB_HOST} port=6543 user=${PROD_DB_USER} dbname=postgres sslmode=require -X -v ON_ERROR_STOP=1"
          echo '=== Q0 connection identity ==='
          $PSQL -c "SELECT current_user AS current_user, session_user AS session_user;"
          echo '=== Q1 roles (anon/authenticated/service_role/authenticator/postgres) ==='
          $PSQL -c "SELECT rolname, rolsuper, rolinherit, rolcanlogin, rolbypassrls FROM pg_roles WHERE rolname IN ('anon','authenticated','service_role','authenticator','postgres') ORDER BY rolname;"
          echo '=== Q2 full role memberships (pg_auth_members) ==='
          $PSQL -c "SELECT m.rolname AS member, r.rolname AS granted_role FROM pg_auth_members am JOIN pg_roles m ON m.oid = am.member JOIN pg_roles r ON r.oid = am.roleid ORDER BY 1, 2;"
          echo '=== Q3 all default privileges (pg_default_acl) ==='
          $PSQL -c "SELECT defaclnamespace::regnamespace AS schema, defaclobjtype, defaclacl, pg_get_userbyid(defaclrole) AS for_role FROM pg_default_acl ORDER BY 1, 2, 4;"
          echo '=== Q4 functions whose ACL names authenticated ==='
          $PSQL -c "SELECT n.nspname, p.proname, pg_get_userbyid(p.proowner) AS owner, p.proacl FROM pg_proc p JOIN pg_namespace n ON n.oid = p.pronamespace WHERE p.proacl::text LIKE '%authenticated%' ORDER BY 1, 2 LIMIT 30;"
          echo '=== Q5 EXECUTE posture of existing postgres-owned public functions ==='
          $PSQL -c "SELECT p.proname, pg_get_userbyid(p.proowner) AS owner, p.proacl, has_function_privilege('anon', p.oid, 'EXECUTE') AS anon_exec, has_function_privilege('authenticated', p.oid, 'EXECUTE') AS auth_exec FROM pg_proc p JOIN pg_namespace n ON n.oid = p.pronamespace WHERE n.nspname = 'public' AND p.proowner = (SELECT oid FROM pg_roles WHERE rolname = 'postgres') ORDER BY p.proname LIMIT 25;"
          echo '=== Q6 co_owner functions present now (expect 0) ==='
          $PSQL -c "SELECT count(*) AS co_owner_fn_count FROM pg_proc WHERE proname LIKE 'co_owner%';"
          echo '=== Q7 ledger ==='
          $PSQL -c "SELECT count(*)::int AS n, max(version) AS latest FROM supabase_migrations.schema_migrations;"
