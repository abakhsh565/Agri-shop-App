name: QA isolation-tenant provision

# Creates the two identities of the dedicated empty tenant the E2E write
# lanes need (scripts/dev/qa-tenant.mjs): the QA Isolation Owner and the
# QA Isolation Employee, with their memberships and auth credentials.
# The script refuses any target that is not the QA project, refuses the
# shared QA shop, and refuses a tenant that holds business rows.
# Default run is a PLAN only (dry run, nothing written). Only a dispatch
# with apply=true performs the writes. Manual dispatch only. No production
# secret or URL anywhere in this file.
on:
  workflow_dispatch:
    inputs:
      apply:
        description: 'Perform the writes (false = plan only)'
        required: false
        type: boolean
        default: false

jobs:
  provision:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Plan isolation-tenant fixture (dry run)
        env:
          QA_SUPABASE_URL: ${{ secrets.QA_SUPABASE_URL }}
          QA_SUPABASE_ANON_KEY: ${{ secrets.QA_SUPABASE_ANON_KEY }}
          QA_SUPABASE_SERVICE_ROLE: ${{ secrets.QA_SUPABASE_SERVICE_ROLE }}
          QA_DB_HOST: ${{ secrets.QA_DB_HOST }}
          QA_DB_USER: ${{ secrets.QA_DB_USER }}
          QA_DB_PASS: ${{ secrets.QA_DB_PASS }}
        run: node scripts/dev/qa-tenant.mjs
      - name: Apply isolation-tenant fixture
        if: ${{ inputs.apply == true }}
        env:
          QA_SUPABASE_URL: ${{ secrets.QA_SUPABASE_URL }}
          QA_SUPABASE_ANON_KEY: ${{ secrets.QA_SUPABASE_ANON_KEY }}
          QA_SUPABASE_SERVICE_ROLE: ${{ secrets.QA_SUPABASE_SERVICE_ROLE }}
          QA_DB_HOST: ${{ secrets.QA_DB_HOST }}
          QA_DB_USER: ${{ secrets.QA_DB_USER }}
          QA_DB_PASS: ${{ secrets.QA_DB_PASS }}
        run: node scripts/dev/qa-tenant.mjs --apply
