name: Fix QA duplicate owners for 0280 (one-time)

# ONE-TIME. Delete this workflow after the fix is applied and verified.
#
# WHY THIS FILE EXISTS
#
# Migration 0280 creates `memberships_one_active_owner_per_shop`: one active
# standard owner per shop. The QA apply failed on it, because the fixture shop
# 00000000-0000-0000-0000-000000000001 holds SIX active standard owners (probe
# run 42206750684). Migration 0113's trigger gives an 'owner' membership to
# every user inserted with `is_original_owner = true`, and five test identities
# were seeded that way although they are admins. The repo script
# `scripts/dev/qa-fix-0280-duplicate-owners.mjs` demotes those five (QA Admin
# + four lane users) to admin memberships; the designated owner, Khalid Khan,
# is untouched. The seed files were fixed at the same time so the duplicates
# cannot come back.
#
# This workflow is QA-ONLY: it passes only QA_* secrets and never names
# production; the script itself refuses any non-QA target. Manual only
# (workflow_dispatch) with an explicit apply gate: dispatch with apply=false
# prints the dry-run plan (nothing written); only a second dispatch with
# apply=true writes. Every run is a deliberate act, and the run log is the
# record of what changed. Delete this file once the fix is applied and the
# 0280 apply has passed.
on:
  workflow_dispatch:
    inputs:
      apply:
        description: 'Write the changes (false = dry-run plan only)'
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  fix:
    name: Demote the five non-owner QA identities to admin
    runs-on: ubuntu-latest
    env:
      QA_SUPABASE_URL: ${{ secrets.QA_SUPABASE_URL }}
      QA_SUPABASE_ANON_KEY: ${{ secrets.QA_SUPABASE_ANON_KEY }}
      QA_SUPABASE_SERVICE_ROLE: ${{ secrets.QA_SUPABASE_SERVICE_ROLE }}
      QA_DB_HOST: ${{ secrets.QA_DB_HOST }}
      QA_DB_USER: ${{ secrets.QA_DB_USER }}
      QA_DB_PASS: ${{ secrets.QA_DB_PASS }}
    steps:
      - name: Check out the branch this run was dispatched on
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Fix the duplicate owners (dry run unless apply=true)
        run: node scripts/dev/qa-fix-0280-duplicate-owners.mjs ${{ inputs.apply && '--apply' || '' }}
