name: Restore QA fixtures (roles + grants)

# WHY THIS FILE EXISTS
#
# The QA database's built-in roles drifted: the 2026-11-06 probe found the
# "Inventory Clerk" role holding 25 grants (canonical: 12), including
# customers.create, and the "Store Manager" role missing entirely. The repo
# script scripts/dev/qa-restore-canonical-roles.mjs repairs that — it
# recreates missing canonical roles, resets existing canonical roles' grants
# to the reviewed set (--reset-grants), and re-points fixture memberships
# (--repair-fixtures). It runs in one transaction and rolls back on error,
# and it REFUSES production by project ref.
#
# This workflow is QA-ONLY: it passes only QA_* secrets and never names
# production. It is manual only (workflow_dispatch) with an explicit apply
# gate: dispatch with apply=false prints the dry-run plan (nothing written);
# only a second dispatch with apply=true writes. Every run is a deliberate
# act, and the run log is the record of what changed.
on:
  workflow_dispatch:
    inputs:
      apply:
        description: 'Write the changes (false = dry-run plan only)'
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  restore:
    name: Restore QA canonical roles and fixture access
    runs-on: ubuntu-latest
    env:
      QA_SUPABASE_URL: ${{ secrets.QA_SUPABASE_URL }}
      QA_SUPABASE_ANON_KEY: ${{ secrets.QA_SUPABASE_ANON_KEY }}
      QA_SUPABASE_SERVICE_ROLE: ${{ secrets.QA_SUPABASE_SERVICE_ROLE }}
      QA_DB_HOST: ${{ secrets.QA_DB_HOST }}
      QA_DB_USER: ${{ secrets.QA_DB_USER }}
      QA_DB_PASS: ${{ secrets.QA_DB_PASS }}
    steps:
      - name: Check out fix/product-gaps (the --reset-grants flag lives there until PR #10 merges)
        uses: actions/checkout@v4
        with:
          ref: fix/product-gaps

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: QA credentials are required - a restore that did not run is not a pass
        run: |
          missing=""
          for key in QA_DB_HOST QA_DB_USER QA_DB_PASS; do
            if [ -z "${!key:-}" ]; then missing="$missing $key"; fi
          done
          if [ -n "$missing" ]; then
            echo "::error::QA restore is BLOCKED, not passed — missing:$missing"
            exit 1
          fi

      - name: Plan (dry run - prints what would change, writes nothing)
        run: node scripts/dev/qa-restore-canonical-roles.mjs --reset-grants --repair-fixtures

      - name: Apply (only when the dispatch input says so)
        if: ${{ inputs.apply }}
        run: node scripts/dev/qa-restore-canonical-roles.mjs --reset-grants --repair-fixtures --apply
