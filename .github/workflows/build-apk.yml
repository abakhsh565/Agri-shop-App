name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # Prefer IPv4 for DNS. Supabase's direct host (db.<ref>.supabase.co) publishes
      # an AAAA record but no A record, and GitHub-hosted runners have no IPv6
      # route, which is how the suite used to burn ~46 minutes of 120s hook
      # timeouts before failing.
      NODE_OPTIONS: --dns-result-order=ipv4first
      QA_SUPABASE_URL: ${{ secrets.QA_SUPABASE_URL }}
      QA_SUPABASE_ANON_KEY: ${{ secrets.QA_SUPABASE_ANON_KEY }}
      QA_SUPABASE_SERVICE_ROLE: ${{ secrets.QA_SUPABASE_SERVICE_ROLE }}
      QA_DB_HOST: ${{ secrets.QA_DB_HOST }}
      QA_DB_USER: ${{ secrets.QA_DB_USER }}
      QA_DB_PASS: ${{ secrets.QA_DB_PASS }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      # ─── Fail fast if the QA database is unreachable ────────────────
      # Without this, an unreachable host costs ~46 minutes of hook timeouts and
      # the APK job never starts. This costs seconds.
      - name: Verify QA Database Reachability
        run: node scripts/check-qa-connectivity.mjs

      # ─── Unit + Integration Tests (Vitest) ──────────────────────────
      - name: Run Vitest (unit + integration)
        run: npx vitest run --reporter=verbose

      # ─── Browser E2E Tests (Playwright) ─────────────────────────────
      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      # The E2E suite signs in through the real login flow, which needs each app
      # user to have a confirmed Supabase Auth credential. Re-provisioning is
      # idempotent and repairs a QA database that was cleaned without one.
      - name: Provision QA Auth Sessions
        run: node scripts/provision-auth-sessions.mjs
        env:
          QA_SUPABASE_URL: ${{ secrets.QA_SUPABASE_URL }}
          QA_SUPABASE_SERVICE_ROLE: ${{ secrets.QA_SUPABASE_SERVICE_ROLE }}
          QA_DB_HOST: ${{ secrets.QA_DB_HOST }}
          QA_DB_USER: ${{ secrets.QA_DB_USER }}
          QA_DB_PASS: ${{ secrets.QA_DB_PASS }}

      - name: Run Playwright E2E
        run: npx playwright test
        env:
          VITE_SUPABASE_URL: ${{ secrets.QA_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.QA_SUPABASE_ANON_KEY }}
          VITE_SUPABASE_PROJECT_ID: bpybjrjenwccowvtrevu

      - name: Upload Playwright Report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: tests/e2e/results.json
          retention-days: 7

      # ─── Clean QA Database After Tests ──────────────────────────────
      - name: Clean QA Database
        if: always()
        run: node scripts/clean-test-data.mjs
        env:
          QA_DATABASE_URL: postgresql://${{ secrets.QA_DB_USER }}:${{ secrets.QA_DB_PASS }}@${{ secrets.QA_DB_HOST }}:5432/postgres

  build:
    name: Build APK
    needs: [test]
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK Platform 35
        run: |
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0"
          yes | sdkmanager --licenses || true

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Build Web App
        run: npm run build

      - name: Setup Android Platform
        run: |
          rm -rf android/
          npx cap add android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Inject Camera Permission
        run: node .github/inject-permissions.cjs

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Create GitHub Release with APK
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-build-${{ github.run_number }}
          name: APK Build #${{ github.run_number }}
          body: |
            Auto-built APK from commit ${{ github.sha }}
            Branch: ${{ github.ref_name }}
          files: android/app/build/outputs/apk/debug/app-debug.apk
          make_latest: true
