name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK Platform 35
        run: |
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0"
          yes | sdkmanager --licenses || true

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Build Web App
        run: npm run build

      - name: Setup Android Platform
        run: |
          rm -rf android/
          npx cap add android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Inject Camera Permission
        run: node .github/inject-permissions.cjs

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 3
          overwrite: true

      - name: Cleanup Old Artifacts
        if: always()
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            let page = 1, deleted = 0;
            while (true) {
              const list = await github.rest.actions.listArtifactsForRepo({
                owner: context.repo.owner,
                repo: context.repo.repo,
                per_page: 100,
                page: page,
              });
              if (list.data.artifacts.length === 0) break;
              for (const artifact of list.data.artifacts) {
                // Only delete artifacts older than 1 day, keep the current run's artifact
                const age = Date.now() - new Date(artifact.created_at).getTime();
                if (age > 86400000 && artifact.name.startsWith('app-debug')) {
                  try {
                    await github.rest.actions.deleteArtifact({
                      owner: context.repo.owner,
                      repo: context.repo.repo,
                      artifact_id: artifact.id,
                    });
                    deleted++;
                  } catch (e) {}
                }
              }
              if (list.data.artifacts.length < 100) break;
              page++;
            }
            console.log(`Deleted ${deleted} old artifacts`);
