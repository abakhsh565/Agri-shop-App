name: Build Android APK

# TRIGGER: dispatch only. It used to run on every push to `main` as well, and that was the single
# largest source of waiting in this repository: a push started BOTH this workflow's `test` job and
# `ci.yml`'s `qa` job, and both take the one `qa-database` concurrency group. This job is slower, so
# it usually won, and the CI run the production deploy waits on sat pending behind it — measured
# 2026-10-18: push 22:32:26, gates green 22:33:54, QA job started 22:55:27. The integration suite ran
# twice for one commit, and the gate finished ~22 minutes later than the work required.
#
# Nothing is lost by removing the push: an APK is an artefact, not the gate, `AGENTS.md` §7 says no
# APK during development or QA loops, and the release path is a deliberate dispatch from a verified
# commit (`docs/APK_SIGNING_HANDOVER_2026-10-15.md`). The web release still deploys automatically
# from a gated `main` commit through `deploy-production.yml`.
on:
  workflow_dispatch:

jobs:
  test:
    name: Run Tests
    concurrency:
      # The same repository-wide group ci.yml's `qa` and `e2e` jobs use: this job provisions QA
      # auth sessions, runs the integration suites and drives Playwright against the one QA
      # database, so it must never run beside another QA writer. A newer run waits here; it does not
      # cancel this job. `cancel-in-progress: false` is load-bearing — a cancelled suite leaves its
      # run-owned rows behind and can strand the QA advisory lock until its socket dies.
      group: qa-database
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # Prefer IPv4 for DNS. Supabase's direct host (db.<ref>.supabase.co) publishes
      # an AAAA record but no A record, and GitHub-hosted runners have no IPv6
      # route, which is how the suite used to burn ~46 minutes of 120s hook
      # timeouts before failing.
      NODE_OPTIONS: --dns-result-order=ipv4first
      QA_SUPABASE_URL: ${{ secrets.QA_SUPABASE_URL }}
      QA_SUPABASE_ANON_KEY: ${{ secrets.QA_SUPABASE_ANON_KEY }}
      QA_SUPABASE_SERVICE_ROLE: ${{ secrets.QA_SUPABASE_SERVICE_ROLE }}
      QA_DB_HOST: ${{ secrets.QA_DB_HOST }}
      QA_DB_USER: ${{ secrets.QA_DB_USER }}
      QA_DB_PASS: ${{ secrets.QA_DB_PASS }}
      # The vitest steps below run the app's own modules, which resolve their environment from
      # `import.meta.env` at import time. Without these three names the suite refuses to resolve
      # an environment at all ([CONFIG] Neither VITE_SUPABASE_URL nor VITE_SUPABASE_PROJECT_ID
      # is set), which takes `authSafetyGuard` down with it: a refused configuration implies
      # "sms", so the suite's own "we really are in demo mode" assertion fails. Proven locally by
      # running the suite with these three names empty (9/9 files red) and with the QA values
      # (9/9 files, 82 tests green). PROJECT_ID is a project ref, not a secret.
      VITE_SUPABASE_URL: ${{ secrets.QA_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ secrets.QA_SUPABASE_ANON_KEY }}
      VITE_SUPABASE_PROJECT_ID: bpybjrjenwccowvtrevu
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      # ─── Fail fast if the QA database is unreachable ────────────────
      # Without this, an unreachable host costs ~46 minutes of hook timeouts and
      # the APK job never starts. This costs seconds.
      - name: Verify QA Database Reachability
        run: node scripts/check-qa-connectivity.mjs

      # ─── The migration ledger must contain every candidate migration ──────────
      # Read-only. Every file in supabase/migrations/ must be recorded in
      # supabase_migrations.schema_migrations with the sha256 it had when it was applied, and no
      # file may be numbered before the newest recorded version. QA is intentionally ahead of a
      # production hotfix, so the reviewed allowlist covers the QA-only rows (0233–0276); any
      # unlisted or stale QA-only row still fails, as does any candidate file that is missing or
      # hash-changed.
      - name: Verify the migration ledger contains every candidate migration
        run: node scripts/migrate.mjs verify --env staging --ledger-only-allowlist .github/qa-ledger-only.txt

      # ─── Unit + Integration Tests (Vitest) ──────────────────────────
      # Unit tests are isolated; they run in parallel. The integration suite shares ONE QA
      # database, and some files mutate the shared fixture users (active shop, permissions) while
      # others read authorisation state or introspect the schema. On run 37051191071 that race
      # turned three files red on a 2-core runner although each of them passed in isolation and
      # the whole folder passed locally under 2 workers. One file at a time removes the race; it
      # costs minutes, not correctness.
      - name: Run unit tests
        run: npx vitest run tests/unit --reporter=verbose

      # The suites sign in through the real login flow, which needs each app user to have a
      # confirmed Supabase Auth credential. Re-provisioning is idempotent and repairs a QA
      # database that was cleaned without one. It runs BEFORE the integration suite because
      # that suite signs in too — branchScopeEnforcement asserts a warehouse-scoped employee
      # can sign in — and run 38645773012 failed it with "Invalid login credentials" while
      # this repair step, the one thing that could have helped, sat later in the job.
      - name: Provision QA Auth Sessions
        run: node scripts/provision-auth-sessions.mjs
        env:
          QA_SUPABASE_URL: ${{ secrets.QA_SUPABASE_URL }}
          QA_SUPABASE_SERVICE_ROLE: ${{ secrets.QA_SUPABASE_SERVICE_ROLE }}
          QA_DB_HOST: ${{ secrets.QA_DB_HOST }}
          QA_DB_USER: ${{ secrets.QA_DB_USER }}
          QA_DB_PASS: ${{ secrets.QA_DB_PASS }}

      - name: Run integration tests (measured shard, then serial remainder)
        # The shared runner enforces the exact partition and runs both ordered projects in one
        # Vitest process, so the QA lock stays held across the measured shard and serial remainder.
        run: node scripts/dev/run-integration.mjs --reporter=verbose

      # ─── Browser E2E Tests (Playwright) ─────────────────────────────
      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Run Playwright E2E
        run: npx playwright test
        env:
          VITE_SUPABASE_URL: ${{ secrets.QA_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.QA_SUPABASE_ANON_KEY }}
          VITE_SUPABASE_PROJECT_ID: bpybjrjenwccowvtrevu
          VITE_APP_ENV: staging
          VITE_OTP_DELIVERY: demo

      - name: Upload Playwright Report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: tests/e2e/results.json
          retention-days: 7

      # Same seed as ci.yml: whichever test step failed, the run leaves the five fields behind.
      # Last in the job on purpose — a failing E2E run is prompted too, and this job's only failure
      # artifact is the Playwright report, which does not exist when unit or integration fails first.
      - name: Failure record — required when this job fails
        if: failure()
        continue-on-error: true
        run: |
          {
            echo "### CI failure — the five fields are required"
            echo ""
            echo "- commit: \`${{ github.sha }}\`"
            echo "- run: \`${{ github.run_id }}\` — ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo "- job: \`${{ github.job }}\`"
            echo "- observed: the failing step above; its log is the evidence"
            echo "- root cause: **not yet confirmed**"
            echo "- prevention: pending"
            echo "- regression: name the test that must pass, and its result"
            echo ""
            echo "Add a reviewed entry to \`docs/FAILURE-LOG.md\` before this failure is closed."
          } >> "$GITHUB_STEP_SUMMARY"

      # ─── What used to be here, and why it must not come back ────────
      #
      # A step named "Clean QA Database" ran `node scripts/clean-test-data.mjs` with
      # `if: always()`. That script issues table-wide DELETEs — customers, products,
      # companies, sales, payments, inventory, returns, voids, notifications, reminders,
      # audit, shop_requests, activity_log — and then deletes every user that is not one of
      # four seed phones, plus their `auth.users` rows.
      #
      # So building an APK — an artefact task, on push to main and on every manual run —
      # silently destroyed the QA business data and the QA accounts it did not need to touch,
      # whether the tests passed or failed. A build must never be a reason to lose history,
      # and it must never be green because it deleted the evidence of what it just ran.
      #
      # The suites manage their own fixtures instead: tests/e2e/cleanupOwnership.ts removes
      # only the rows a run created, and tests/setup/global-teardown.ts cleans only when
      # QA_CLEAN_AFTER_RUN=1. A deliberate QA reset is an owner action through
      # `npm run qa:clean`, which refuses to run without that confirmation.

  build:
    name: Build APK
    needs: [test]
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '21'

      # ─── Android SDK ─────────────────────────────────────────────────────
      # ubuntu-latest already carries the Android SDK and its cmdline-tools. The
      # android-actions/setup-android@v3 action was removed because it runs
      # `sdkmanager tools`, and the `tools` package no longer exists in the SDK
      # repository — run 37072640900 failed inside the action itself with
      # "Warning: Failed to find package 'tools'" and exit 1, before any build step
      # ran. This step only locates the SDK the runner already has.
      - name: Locate the runner's Android SDK
        run: |
          if [ -z "${ANDROID_HOME:-}" ] || [ ! -d "$ANDROID_HOME" ]; then
            echo "ANDROID_HOME is not set on this runner image — the build has no SDK to use." >&2
            exit 1
          fi
          SDKMANAGER="$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | sort -V | tail -1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "No sdkmanager found under $ANDROID_HOME/cmdline-tools." >&2
            exit 1
          fi
          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"
          [ -n "${ANDROID_SDK_ROOT:-}" ] || echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "Android SDK: $ANDROID_HOME (sdkmanager: $SDKMANAGER)"

      - name: Install Android SDK Platform 35
        run: |
          "$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.0"
          yes | "$SDKMANAGER" --licenses || true

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Build Web App
        run: npm run build
        env:
          # The APK must carry THIS environment. vite.config.ts refuses to build without an
          # explicit VITE_APP_ENV, and src/lib/envGuard.ts refuses to start without it, so a
          # missing block here is not a warning — it is a build that cannot produce an app.
          VITE_APP_ENV: staging
          VITE_SUPABASE_URL: ${{ secrets.QA_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.QA_SUPABASE_ANON_KEY }}
          VITE_SUPABASE_PROJECT_ID: bpybjrjenwccowvtrevu
          VITE_OTP_DELIVERY: demo

      - name: Setup Android Platform
        run: |
          rm -rf android/
          npx cap add android

      - name: Sync Capacitor
        run: npx cap sync android

      # `android/` is gitignored and regenerated above, so the manifest cannot be edited in
      # the repo — everything the app needs in it is injected here.
      - name: Inject Android manifest entries (camera + invite deep links)
        run: node .github/inject-permissions.cjs
        env:
          # Set the repository variable APP_LINK_HOST once the app is served from a real https
          # domain publishing /.well-known/assetlinks.json. Until then this is empty and only
          # the app's own scheme is injected — invitation links still open the app.
          APP_LINK_HOST: ${{ vars.APP_LINK_HOST }}

      # The generated android/ project does not contain the app's own microphone plugin. System
      # WebView does not reliably expose the Web Speech API, so the APK needs Android's
      # SpeechRecognizer bridge; otherwise the voice field always reports "unsupported".
      - name: Inject native microphone plugin
        run: node .github/inject-native-speech.cjs

      # ─── Stable release signing ────────────────────────────────────────────
      # A debug keystore is generated fresh on every runner, so its fingerprint changes from
      # one build to the next and no published assetlinks.json could ever match it — Android
      # would silently keep opening invite links in a browser. A stable key is what makes the
      # https App Link verifiable, and it is also what lets a later build install OVER an
      # earlier one; losing it means shipping an update Android refuses to replace.
      - name: Decode release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "ANDROID_KEYSTORE_BASE64 is not set — cannot release-sign. See .github/inject-signing.cjs for the required secrets."
            exit 1
          fi
          mkdir -p keystore
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > keystore/release.jks

      - name: Inject release signing config
        run: node .github/inject-signing.cjs
        env:
          ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/keystore/release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: Build APK
        working-directory: android
        env:
          # The injected signingConfig reads these at configuration time; no password is
          # written into build.gradle.
          ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/keystore/release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease

      # Reads the fingerprint back out of the signed APK, so the file can never describe a
      # key that is not the one this release actually carries. Also verifies the signature.
      - name: Derive App Links assetlinks.json from the signed APK
        run: node scripts/android-assetlinks.mjs android/app/build/outputs/apk/release/app-release.apk
        env:
          APP_LINK_HOST: ${{ vars.APP_LINK_HOST }}

      # Kept out of the release below on purpose. The file exists only when APP_LINK_HOST is
      # set, and a release `files:` entry that matches nothing is version-dependent — if the
      # action treats it as an error it fails the step and the APK is never published, which
      # is a far worse outcome than a missing convenience file.
      - name: Upload assetlinks.json for the App Links domain owner
        if: hashFiles('dist/.well-known/assetlinks.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: assetlinks
          path: dist/.well-known/assetlinks.json
          retention-days: 30

      - name: Create GitHub Release with APK
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-build-${{ github.run_number }}
          name: APK Build #${{ github.run_number }}
          body: |
            Auto-built APK from commit ${{ github.sha }}
            Branch: ${{ github.ref_name }}
          # Only the APK. assetlinks.json is a separate artifact — see the step above.
          files: android/app/build/outputs/apk/release/app-release.apk
          make_latest: true

      # The last job in either workflow that could fail and leave nothing behind. A signing or
      # gradle failure stops the release before any test report exists, and this job's only
      # artefact is produced at the end — so the failing run itself is the evidence. Same
      # non-blocking seed as the test job: failure-only, and it cannot rescue a red build.
      - name: Failure record — required when this job fails
        if: failure()
        continue-on-error: true
        run: |
          {
            echo "### CI failure — the five fields are required"
            echo ""
            echo "- commit: \`${{ github.sha }}\`"
            echo "- run: \`${{ github.run_id }}\` — ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo "- job: \`${{ github.job }}\`"
            echo "- observed: the failing step above; its log is the evidence"
            echo "- root cause: **not yet confirmed**"
            echo "- prevention: pending"
            echo "- regression: name the test that must pass, and its result"
            echo ""
            echo "Add a reviewed entry to \`docs/FAILURE-LOG.md\` before this failure is closed."
          } >> "$GITHUB_STEP_SUMMARY"
