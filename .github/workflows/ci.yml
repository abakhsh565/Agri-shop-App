name: CI — gates for a candidate commit

# WHY THIS FILE EXISTS
#
# Before it, the repository had two workflows: `build-apk.yml` (push to main, dispatch) and
# `backup-database.yml` (nightly production backup). Neither of them was a gate. A pull request
# could be merged, and a commit on the development branch could be pushed, with no required check
# of any kind — the first thing that ever ran the tests against a candidate commit was an Android
# build that also took ~47 minutes. So "the branch is green" was a claim nobody could make, and
# the only CI run on record for a development commit was an APK build that failed at keystore
# decode after the tests had already passed or not passed.
#
# What this workflow does, and what it deliberately does not:
#
#   * It is the required gate for a candidate commit: TypeScript, the unit guards (which include
#     the migration-integrity, production-seeding, environment-target and cleanup-ownership
#     guards), the static workflow/targeting safety proofs, and the production build.
#   * The QA job proves the ledger matches the directory and runs the integration suites against
#     the QA project. QA credentials are REQUIRED — if they are absent the job FAILS and says so,
#     because a check that did not run is not a check that passed.
#   * It never touches production, and it never empties QA: no step here runs a table-wide
#     cleanup. Deleting QA business data is an owner action (`npm run qa:clean`), not a side
#     effect of a build or a test run. A unit guard fails if a workflow re-introduces one.
#   * E2E runs against QA on pull requests into the release branch and on explicit dispatch. The
#     full E2E path is proven by the same steps in build-apk.yml; keeping it off the default push
#     path is what keeps this gate fast enough to actually be required.

on:
  # The permanent chain is dev -> staging -> main. A check that only runs at the last step is how
  # drift accumulated unnoticed before: the branch people work on was the one no workflow watched.
  # Gates therefore run on every push to all three branches, and on every PR into staging or main.
  pull_request:
    # `dev` is included because that is where the work happens: an affected-specs E2E lane there
    # costs minutes and catches a regression the same day, instead of at the end of the chain where
    # the only lane that used to run was the full one.
    branches: [dev, staging, main]
    # A documentation-only change cannot alter the bundle, the schema or a policy. Running the
    # 11–29 minute QA + E2E path for it was pure queue time — and on a metered account it was also
    # the minutes that starved the release. `gates` still runs for anything that can reach the app.
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - 'device-evidence/**'
  push:
    branches: [dev, staging, main]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - 'device-evidence/**'
  workflow_dispatch:
    inputs:
      run_e2e:
        description: 'Also run the Playwright E2E lanes against QA'
        type: boolean
        required: false
        default: false

permissions:
  contents: read

jobs:
  gates:
    name: Gates (tsc · unit guards · safety proofs · build)
    concurrency:
      # A superseded candidate is not worth finishing, so the CHEAP gate still cancels — but only
      # the gate. Cancelling the whole run (what the workflow-level block used to do) also killed a
      # `qa` or `e2e` job mid-suite, and a QA writer killed while it holds the advisory lock leaves
      # its run-owned rows behind.
      group: ci-gates-${{ github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # The suite and the build resolve their environment at import time, and a build that cannot
      # name its database must not guess one — so the process needs the names, exactly as
      # build-apk.yml already provides them. These are the QA project's public values; the gates
      # job authorizes nothing with them and never writes to the database.
      VITE_APP_ENV: staging
      VITE_OTP_DELIVERY: demo
      VITE_SUPABASE_URL: ${{ secrets.QA_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ secrets.QA_SUPABASE_ANON_KEY }}
      VITE_SUPABASE_PROJECT_ID: bpybjrjenwccowvtrevu
      # Two guards (e2eCleanupOwnership, signalEngine) import tests/setup/qa-client, which builds a
      # client at module load, so the names must resolve here too. Naming them authorizes nothing:
      # nothing in this job opens a connection or writes a row.
      QA_SUPABASE_URL: ${{ secrets.QA_SUPABASE_URL }}
      QA_SUPABASE_ANON_KEY: ${{ secrets.QA_SUPABASE_ANON_KEY }}
      QA_SUPABASE_SERVICE_ROLE: ${{ secrets.QA_SUPABASE_SERVICE_ROLE }}
    steps:
      - name: Checkout the candidate commit
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        # `--legacy-peer-deps` matches the rest of the pipeline; `ci` (not `install`) so the
        # lockfile is authoritative and the gate cannot pass on a resolution the lockfile
        # does not describe.
        run: npm ci --legacy-peer-deps

      - name: TypeScript
        run: npx tsc --noEmit

      - name: Unit guards (migrations · production seeding · environment · cleanup ownership)
        # 73s / 94 files locally; on a runner it is the smallest part of this job. Sharding it was
        # measured and rejected: the whole `gates` job takes ~1 minute, so three extra jobs would
        # add installs and queue slots to save a few seconds. The cost is in `qa` and `e2e`.
        run: npx vitest run tests/unit --reporter=dot

      - name: Backup workflow safety proof
        run: node scripts/verify-workflow-safety.mjs

      - name: Environment targeting refusals
        run: node scripts/verify-targeting-refusals.mjs

      - name: Production build
        run: npm run build

      - name: Record what was gated
        run: |
          echo "### CI gates passed" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- commit: \`${{ github.sha }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- ref: \`${{ github.ref }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- event: \`${{ github.event_name }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "> \`tests/unit/branchIdentityBoundary.test.ts\` reports itself SKIPPED here, and only" >> "$GITHUB_STEP_SUMMARY"
          echo "> here: it executes SQL against the recorded QA snapshot, which is a logical dump of a" >> "$GITHUB_STEP_SUMMARY"
          echo "> real environment and therefore lives in gitignored \`backups/\`. The generator comparison" >> "$GITHUB_STEP_SUMMARY"
          echo "> case in \`tests/unit/forwardFilesAdditionality.test.ts\` skips for the same reason. Those are" >> "$GITHUB_STEP_SUMMARY"
          echo "> checks that did not run, not ones that passed. That is a check that" >> "$GITHUB_STEP_SUMMARY"
          echo "> did not run — not one that passed. Run it where the artifact exists:" >> "$GITHUB_STEP_SUMMARY"
          echo "> \`npm run verify:baseline -- --baseline staging --since <version>\`." >> "$GITHUB_STEP_SUMMARY"

      # A red gate used to leave nothing but an expiring log. This seeds the five fields in the run's
      # own summary, so the observed failure survives the session. `if: failure()` keeps it off a
      # green run, and `continue-on-error` keeps a bug in this reporting step from replacing the
      # reason the job actually failed.
      - name: Failure record — required when this job fails
        if: failure()
        continue-on-error: true
        run: |
          {
            echo "### CI failure — the five fields are required"
            echo ""
            echo "- commit: \`${{ github.sha }}\`"
            echo "- run: \`${{ github.run_id }}\` — ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo "- job: \`${{ github.job }}\`"
            echo "- observed: the failing step above; its log is the evidence"
            echo "- root cause: **not yet confirmed**"
            echo "- prevention: pending"
            echo "- regression: name the test that must pass, and its result"
            echo ""
            echo "Add a reviewed entry to \`docs/FAILURE-LOG.md\` before this failure is closed."
          } >> "$GITHUB_STEP_SUMMARY"

  qa:
    name: QA (migration ledger · integration suites)
    # PULL REQUESTS ONLY. A push to dev/staging/main is already covered by the PR that produced it,
    # and every QA job is serialized on the `qa-database` group — so the duplicate push run did not
    # add evidence, it added QUEUE: the PR's own QA then waited behind a second identical suite.
    # Measured on 2026-11-13: promotion run 43409329236 sat in `PENDING` for 25 minutes while the
    # push-triggered run for the same commit held the group. Gates still run on every push, so a
    # commit is never unbuilt; only the database-writing suites are per-PR.
    if: github.event_name == 'pull_request'
    concurrency:
      # ONE QA-MUTATING JOB AT A TIME. This literal group is shared by this workflow's `e2e` job and
      # by build-apk.yml's `test` job: concurrency group names share one repository-wide namespace,
      # so a push to main no longer starts ci.qa and apk.test against the same database together.
      #
      # `cancel-in-progress: false` is load-bearing — a cancelled integration suite leaves its
      # run-owned rows behind (tests/e2e/cleanupOwnership.ts) and can strand the QA advisory lock
      # (tests/setup/qa-lock.ts) until its socket dies. A newer run WAITS here; it never kills this.
      group: qa-database
      cancel-in-progress: false
    needs: [gates]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # Same IPv4 preference as build-apk.yml: Supabase's direct host publishes AAAA but no A.
      NODE_OPTIONS: --dns-result-order=ipv4first
      QA_SUPABASE_URL: ${{ secrets.QA_SUPABASE_URL }}
      QA_SUPABASE_ANON_KEY: ${{ secrets.QA_SUPABASE_ANON_KEY }}
      QA_SUPABASE_SERVICE_ROLE: ${{ secrets.QA_SUPABASE_SERVICE_ROLE }}
      QA_DB_HOST: ${{ secrets.QA_DB_HOST }}
      QA_DB_USER: ${{ secrets.QA_DB_USER }}
      QA_DB_PASS: ${{ secrets.QA_DB_PASS }}
      VITE_SUPABASE_URL: ${{ secrets.QA_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ secrets.QA_SUPABASE_ANON_KEY }}
      VITE_SUPABASE_PROJECT_ID: bpybjrjenwccowvtrevu
    steps:
      - name: Checkout the candidate commit
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci --legacy-peer-deps

      - name: QA credentials are required — a check that did not run is not a pass
        run: |
          missing=""
          for key in QA_SUPABASE_URL QA_SUPABASE_ANON_KEY QA_SUPABASE_SERVICE_ROLE QA_DB_HOST QA_DB_USER QA_DB_PASS; do
            if [ -z "${!key:-}" ]; then missing="$missing $key"; fi
          done
          if [ -n "$missing" ]; then
            echo "::error::QA verification is BLOCKED, not passed — missing:$missing"
            echo "Add the missing repository secrets, then re-run. Until then this gate cannot"
            echo "claim the candidate was verified against QA."
            exit 1
          fi

      - name: QA database reachability
        run: node scripts/check-qa-connectivity.mjs

      - name: Migration ledger must contain every candidate migration
        # Fail closed: every candidate file must be recorded on QA with its hash, and QA must not
        # hold a row whose file is gone. The reviewed allowlist (`.github/qa-ledger-only.txt`) was
        # retired once the QA-ahead rows were reconciled — see docs/PRODUCTION_MIGRATION_PLAN.md §5
        # — so the flag is gone and a ledger-only row fails this step instead of being excused.
        run: node scripts/migrate.mjs verify --env staging

      - name: Provision QA Auth Sessions
        # Integration and browser suites sign in through the real phone/credential flow. This
        # idempotent repair prevents a missing auth credential from surfacing as an app failure.
        run: node scripts/provision-auth-sessions.mjs
        env:
          QA_SUPABASE_URL: ${{ secrets.QA_SUPABASE_URL }}
          QA_SUPABASE_ANON_KEY: ${{ secrets.QA_SUPABASE_ANON_KEY }}
          QA_SUPABASE_SERVICE_ROLE: ${{ secrets.QA_SUPABASE_SERVICE_ROLE }}
          QA_DB_HOST: ${{ secrets.QA_DB_HOST }}
          QA_DB_USER: ${{ secrets.QA_DB_USER }}
          QA_DB_PASS: ${{ secrets.QA_DB_PASS }}

      - name: Integration suites (measured shard, then serial remainder)
        # Each suite creates and removes its own controlled tenants. QA's own shops and history
        # are never the fixture, and nothing here deletes them afterwards.
        # The shared runner enforces the exact partition and runs both ordered projects in one
        # Vitest process, so the QA lock stays held across the measured four-worker shard and the
        # serial remainder. `dot` keeps log volume bounded across the full suite.
        run: node scripts/dev/run-integration.mjs --reporter=dot

      # Same seed as the gates job: whichever step in this job failed — credentials, reachability,
      # ledger, or an integration suite — the summary names the run and requires the record.
      - name: Failure record — required when this job fails
        if: failure()
        continue-on-error: true
        run: |
          {
            echo "### CI failure — the five fields are required"
            echo ""
            echo "- commit: \`${{ github.sha }}\`"
            echo "- run: \`${{ github.run_id }}\` — ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo "- job: \`${{ github.job }}\`"
            echo "- observed: the failing step above; its log is the evidence"
            echo "- root cause: **not yet confirmed**"
            echo "- prevention: pending"
            echo "- regression: name the test that must pass, and its result"
            echo ""
            echo "Add a reviewed entry to \`docs/FAILURE-LOG.md\` before this failure is closed."
          } >> "$GITHUB_STEP_SUMMARY"

  e2e:
    name: E2E lanes against QA
    concurrency:
      # The same QA database as `qa` above. Playwright writes the same fixtures and now claims the
      # same advisory lock (tests/e2e/global-setup.ts → tests/setup/qa-lock.ts), so this group and
      # the lock agree: the group orders CI jobs, and the lock is the only thing that can also see a
      # developer's machine, which no concurrency group can.
      group: qa-database
      cancel-in-progress: false
    needs: [gates, qa]
    # THREE LANES, ONE JOB. What runs depends on where the pull request is headed:
    #
    #   into `main`       the 20-test SMOKE lane (.github/e2e-smoke.txt) — ~10 minutes, required
    #   into `dev`/`staging`  only the specs this change can reach (affected-e2e.mjs) — ~3-8 minutes
    #   dispatch          whatever the selector decides; the full 157-test suite lives in
    #                     e2e-full-nightly.yml, off the release path
    #
    # WHY: 157 tests on ONE worker (single-writer QA database, shared pinned fixtures) is ~80
    # minutes measured at ~32 s per test. As the mandatory check before `main` that is a wager, not
    # a gate — one stale selector at minute 60 sends the work back to the start. The smoke lane
    # covers the same core flows in about ten minutes, and the nightly run keeps full coverage.
    if: github.event_name == 'pull_request' || inputs.run_e2e
    runs-on: ubuntu-latest
    # `--max-failures=2` bounds a broken run; the affected lane is minutes, the smoke lane is tens
    # of minutes. This is a ceiling for the worst case, not an expectation.
    timeout-minutes: 90
    env:
      NODE_OPTIONS: --dns-result-order=ipv4first
      QA_SUPABASE_URL: ${{ secrets.QA_SUPABASE_URL }}
      QA_SUPABASE_ANON_KEY: ${{ secrets.QA_SUPABASE_ANON_KEY }}
      QA_SUPABASE_SERVICE_ROLE: ${{ secrets.QA_SUPABASE_SERVICE_ROLE }}
      QA_DB_HOST: ${{ secrets.QA_DB_HOST }}
      QA_DB_USER: ${{ secrets.QA_DB_USER }}
      QA_DB_PASS: ${{ secrets.QA_DB_PASS }}
      VITE_SUPABASE_URL: ${{ secrets.QA_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ secrets.QA_SUPABASE_ANON_KEY }}
      VITE_SUPABASE_PROJECT_ID: bpybjrjenwccowvtrevu
    steps:
      - name: Checkout the candidate commit
        uses: actions/checkout@v7
        with:
          # The affected-spec selection needs the base commit to diff against; a depth-1 checkout
          # has no merge-base and the selector would fall back to the full suite every time.
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci --legacy-peer-deps

      # The browser bundle is ~120 MB and does not change between commits; without this cache every
      # run paid for it. Keyed on the lockfile, because that is what pins the Playwright version.
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      # The suite is single-worker by design (one QA database, pinned shared fixture ids), so the
      # real runtime lever is the NUMBER OF FAILING SPECS, not concurrency: each failure burned its
      # 30 s navigation timeout. Fixing sign-in determinism is what takes this lane from ~76 minutes
      # to minutes.
      - name: Provision QA Auth Sessions
        run: node scripts/provision-auth-sessions.mjs

      # WHICH LANE. A pull request into `main` gets the smoke list; everything else gets the
      # affected-spec selection. `scripts/dev/affected-e2e.mjs` maps changed files through the SAME
      # lane-map the local gate uses and prints `ALL` whenever the answer is not certain (tests,
      # fixtures, migrations, workflows, or a source file no lane names). A skipped spec is a check
      # that did not run, so the fallback is the whole suite, never a subset.
      - name: Choose the lane
        id: lane
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ] && [ "${{ github.base_ref }}" = "main" ]; then
            specs=$(grep -vE '^\s*(#|$)' .github/e2e-smoke.txt | sed 's|^|tests/e2e/|' | sed 's|$|.spec.ts|' | tr '\n' ' ')
            echo "kind=smoke" >> "$GITHUB_OUTPUT"
            echo "Running the smoke lane: $(echo $specs | wc -w) spec file(s), 20 tests"
          else
            specs=$(node scripts/dev/affected-e2e.mjs --base "${{ github.event.pull_request.base.sha || '' }}")
            if [ -z "$specs" ]; then specs=$(node scripts/dev/affected-e2e.mjs --all); fi
            echo "kind=affected" >> "$GITHUB_OUTPUT"
            echo "Running $(echo $specs | wc -w) affected spec file(s)"
          fi
          echo "specs=$specs" >> "$GITHUB_OUTPUT"

      # `--max-failures=2`: a broken candidate stops after two failures instead of burning the whole
      # allowance. It never turns red into green — a stopped run is a failed run.
      - name: Run Playwright E2E (${{ steps.lane.outputs.kind }} lane)
        run: npx playwright test ${{ steps.lane.outputs.specs }} --max-failures=2

      - name: Upload Playwright Report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: tests/e2e/results.json
          retention-days: 7

      # Same seed as the gates and integration jobs. Run 39131593134 failed here with
      # no summary at all, because this job was the one the loop missed.
      - name: Failure record — required when this job fails
        if: failure()
        continue-on-error: true
        run: |
          {
            echo "### CI failure — the five fields are required"
            echo ""
            echo "- commit: \`${{ github.sha }}\`"
            echo "- run: \`${{ github.run_id }}\` — ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo "- job: \`${{ github.job }}\`"
            echo "- observed: the failing step above; its log is the evidence"
            echo "- root cause: **not yet confirmed**"
            echo "- prevention: pending"
            echo "- regression: name the test that must pass, and its result"
            echo ""
            echo "Add a reviewed entry to \`docs/FAILURE-LOG.md\` before this failure is closed."
          } >> "$GITHUB_STEP_SUMMARY"

      # Nothing cleans QA here on purpose. Each spec owns the rows it created
      # (tests/e2e/cleanupOwnership.ts); emptying the QA database is an owner action.
