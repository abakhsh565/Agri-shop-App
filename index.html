<!doctype html>
<html lang="<!-- figma:lang -->">
  <head>
    <!-- figma:head-start -->
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no"
    />
    <meta name="theme-color" content="#ffffff" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="HisabPay" />
    <!-- The tab icon the app never had: without an explicit <link rel="icon"> the browser
         requests /favicon.ico on every page load and the dev server answers 404, which is a
         console error on every screen (and a real 404 for the owner in production). The
         Android launcher mark is the same asset, so the tab and the app icon agree. -->
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/favicon.png" />
    <title><!-- figma:title --></title>
    
    <!-- Security headers are NOT declared here. X-Frame-Options, X-Content-Type-Options and
         Permissions-Policy are header-only directives: `http-equiv` is ignored for them, so the
         block that used to sit here provided nothing — and Chrome logged "X-Frame-Options may only
         be set via an HTTP header sent along with a document" on every production page load. They
         belong to the response, so they now live in `vercel.json`'s `headers` block, where they are
         actually enforced.

         Permissions-Policy is deliberately NOT among them. `camera=()` would block the camera the
         in-app barcode scanner and photo capture use, so that directive must not be moved to a
         header without an explicit decision to break scanning. Referrer-Policy is enforced by the
         response too; it was the one directive that also worked in markup. -->
    <!-- figma:head-end -->
  </head>
  <body>
    <!-- figma:body-start -->
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <!-- figma:body-end -->
  </body>
</html>
